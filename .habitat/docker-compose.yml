name: tidaltask
services:
  mongo:
    image: mongo:7
    platform: linux/amd64
    command: ["mongod", "--auth"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"

  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    image: tidaltask/api
    platform: linux/amd64
    env_file:
      - ../.env
    depends_on:
      - mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: packages/app/Dockerfile
    image: tidaltask/frontend
    platform: linux/amd64
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"

  nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    depends_on:
      - frontend
      - api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro

volumes:
  mongo-data:
