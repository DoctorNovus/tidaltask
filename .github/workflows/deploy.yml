name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Server + frontend Docker deploy ─────────────────────────────────────────
  deploy-server:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: dashboard.tidaltask.app
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 90m
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/sequenced
            git stash
            git fetch origin main
            git checkout main
            git pull --rebase origin main
            npm install
            npm run deploy
            docker image prune -f

  # ── iOS build + App Store submission ────────────────────────────────────────
  ios-release:
    name: Build & Submit to App Store
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app + sync Capacitor
        run: npm run build:full
        working-directory: packages/app

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/app/ios/App

      # Build archive and submit for App Review (waits for processing)
      - name: Submit to App Store
        working-directory: packages/app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP_IDENTIFIER: com.ottegi.sequenced-app
          BUNDLE_PATH: vendor/bundle
          BUNDLE_DISABLE_SHARED_GEMS: "1"
        run: bundle exec fastlane ios release_app_store
