name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Build Docker images and push to GHCR ────────────────────────────────────
  build-images:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sequenced-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/sequenced-frontend:latest
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Pull pre-built images and restart on the server ─────────────────────────
  deploy-server:
    name: Deploy to Droplet
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: DoctorNovus
        with:
          host: dashboard.tidaltask.app
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /root/sequenced
            git stash
            git fetch origin main
            git checkout main
            git pull --rebase origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  # ── iOS build + App Store submission ────────────────────────────────────────
  ios-release:
    name: Build & Submit to App Store
    if: false
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app + sync Capacitor
        run: npm run build:full
        working-directory: packages/app

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/app/ios/App

      - name: Submit to App Store
        working-directory: packages/app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP_IDENTIFIER: com.ottegi.sequenced-app
          BUNDLE_PATH: vendor/bundle
          BUNDLE_DISABLE_SHARED_GEMS: "1"
        run: bundle exec fastlane ios release_app_store
