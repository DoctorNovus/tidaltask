services:
  mongo:
    image: mongo:7
    platform: linux/amd64
    command: ["mongod", "--auth"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: ghcr.io/doctornovus/sequenced-api:latest
    platform: linux/amd64
    environment:
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      RESET_FROM_EMAIL: ${RESET_FROM_EMAIL}
      WELCOME_FROM_EMAIL: ${WELCOME_FROM_EMAIL}
      WELCOME_EMAIL_SUBJECT: ${WELCOME_EMAIL_SUBJECT}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME}
      UPDATES_WEBHOOK_URL: ${UPDATES_WEBHOOK_URL}
    depends_on:
      - mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    image: ghcr.io/doctornovus/sequenced-frontend:latest
    platform: linux/amd64
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"

  nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    depends_on:
      - frontend
      - api
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro

volumes:
  mongo-data:
